# OpenTelemetry Collector: receive OTLP metrics from the app and log them.
# In production you would export to a backend (e.g. Prometheus, Tempo, a vendor).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
