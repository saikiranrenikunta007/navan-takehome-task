# Tests run against a REAL on-disk database file (file-backed H2), never
# jdbc:h2:mem. Uniqueness is enforced by DB constraints via Flyway.
spring:
  datasource:
    url: jdbc:h2:file:./target/test-db/receipts;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

storage:
  provider: local
  local:
    dir: ./target/test-receipts

management:
  otlp:
    metrics:
      export:
        enabled: false
