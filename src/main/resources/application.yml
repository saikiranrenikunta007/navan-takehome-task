spring:
  application:
    name: receipt-autoitemize
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/receipts?createDatabaseIfNotExist=true}
    username: ${DB_USER:receipts}
    password: ${DB_PASSWORD:receipts}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Storage backend: 'local' (default) or 's3' (Flocii). S3 secrets come from env vars.
storage:
  provider: ${STORAGE_PROVIDER:local}
  local:
    dir: ${STORAGE_LOCAL_DIR:./data/receipts}
  s3:
    endpoint: ${FLOCII_S3_ENDPOINT:}
    region: ${FLOCII_S3_REGION:us-east-1}
    bucket: ${FLOCII_S3_BUCKET:}
    access-key: ${FLOCII_S3_ACCESS_KEY:}
    secret-key: ${FLOCII_S3_SECRET_KEY:}
    path-style-access: true

# OpenTelemetry: Micrometer OTLP registry pushes metrics to the collector.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,otlp
  endpoint:
    health:
      show-details: always
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_ENABLED:true}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 10s
  metrics:
    tags:
      application: receipt-autoitemize
